<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Aditya N</title>
		<style>
			<All pre-existing styling here>
		</style>
	</head>
	<body>
		<nav>
			<div class="nav-container">
				<a href="/" class="nav-brand">Aditya N</a>
				<ul class="nav-links">
					<li><a href="/" class="active">Tools</a></li>
					<li><a href="about.html">About</a></li>
					<li>
						<a
							href="https://github.com/adityanatraj"
							target="_blank"
							rel="noopener noreferrer"
							>GitHub</a
						>
					</li>
				</ul>
			</div>
		</nav>

		<div class="container">
			<header>
				<h1>Tools</h1>
				<p class="subtitle">A collection of simple, (useful?) web toys</p>
			</header>

			<main>
				<div class="section-header">
					<div class="section-title-wrapper">
						<h2 class="section-title">All Tools</h2>
						<button class="add-tool-btn" id="addToolBtn" title="Add new tool">+</button>
					</div>
					<div class="search-box">
						<input
							type="text"
							id="searchInput"
							placeholder="Search tools..."
							autocomplete="off"
						/>
					</div>
				</div>

				<div class="tools-list" id="toolsList">
					<!-- Pre-existing tool entries -->

					<!-- Adding the new tool -->
					<a
						href="tools/web/yahtzee_local.html"
						class="tool-row"
						data-title="Yahtzee Local"
						data-description="Play Yahtzee solo or locally. Classic dice rolling fun for one."
						data-tags="game dice solo yahtzee"
					>
						<div class="tool-icon-row">🎲</div>
						<div class="tool-content">
							<div class="tool-header">
								<h3 class="tool-title-row">Yahtzee Local</h3>
								<span class="tag">Game</span>
							</div>
							<p class="tool-description-row">
								Play Yahtzee solo or locally. Classic dice rolling fun for one.
							</p>
						</div>
						<div class="tool-arrow">→</div>
					</a>
				</div>

				<div id="noResults" class="no-results" style="display: none">
					<div class="no-results-icon">🔍</div>
					<div class="no-results-text">No tools found matching your search</div>
				</div>
			</main>

			<footer>
				<p>(c) Aditya Natraj</p>
			</footer>
		</div></body></html>
