<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>aditya n</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			:root {
				--bg-primary: #020617;
				--bg-secondary: #0f172a;
				--text-primary: #e5e7eb;
				--text-secondary: #94a3b8;
				--text-tertiary: #64748b;
				--border-color: #334155;
				--accent-color: #38bdf8;
				--hover-bg: #1e293b;
				--shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
				--shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
				--transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen",
					"Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue",
					sans-serif;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				background: var(--bg-primary);
				color: var(--text-primary);
				line-height: 1.6;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
			}

			/* Navigation */
			nav {
				background: var(--bg-secondary);
				border-bottom: 1px solid var(--border-color);
				position: sticky;
				top: 0;
				z-index: 100;
				backdrop-filter: blur(10px);
				background: rgba(2, 6, 23, 0.95);
			}

			.nav-container {
				max-width: 1200px;
				margin: 0 auto;
				padding: 1rem 2rem;
				display: flex;
				justify-content: space-between;
				align-items: center;
			}

			.nav-brand {
				font-size: 1.25rem;
				font-weight: 600;
				color: var(--text-primary);
				text-decoration: none;
				letter-spacing: -0.02em;
				transition: var(--transition);
			}

			.nav-brand:hover {
				color: var(--accent-color);
			}

			.nav-links {
				list-style: none;
				display: flex;
				gap: 2rem;
				align-items: center;
			}

			.nav-links a {
				color: var(--text-secondary);
				text-decoration: none;
				font-size: 0.95rem;
				font-weight: 500;
				transition: var(--transition);
				position: relative;
			}

			.nav-links a:hover,
			.nav-links a.active {
				color: var(--text-primary);
			}

			.nav-links a.active::after {
				content: "";
				position: absolute;
				bottom: -0.5rem;
				left: 0;
				right: 0;
				height: 2px;
				background: var(--accent-color);
			}

			/* Container */
			.container {
				max-width: 1200px;
				margin: 0 auto;
				padding: 3rem 2rem;
				flex: 1;
				width: 100%;
			}

			/* Header */
			header {
				text-align: center;
				margin-bottom: 3rem;
			}

			h1 {
				font-size: 3rem;
				font-weight: 700;
				letter-spacing: -0.03em;
				margin-bottom: 0.5rem;
				color: var(--text-primary);
			}

			.subtitle {
				font-size: 1.125rem;
				color: var(--text-secondary);
				font-weight: 400;
			}

			/* Section Header */
			.section-header {
				margin-bottom: 2rem;
			}

			.section-title {
				font-size: 1.5rem;
				font-weight: 600;
				color: var(--text-primary);
				letter-spacing: -0.02em;
				margin-bottom: 1.5rem;
			}

			/* Search Box */
			.search-box {
				position: relative;
			}

			.search-box input {
				width: 100%;
				padding: 0.875rem 1.25rem;
				border: 1px solid var(--border-color);
				border-radius: 12px;
				font-size: 1rem;
				background: var(--bg-secondary);
				color: var(--text-primary);
				transition: var(--transition);
				outline: none;
			}

			.search-box input:focus {
				border-color: var(--accent-color);
				box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
			}

			.search-box input::placeholder {
				color: var(--text-tertiary);
			}

			/* Tools List */
			.tools-list {
				display: grid;
				gap: 1rem;
			}

			.tool-row {
				display: flex;
				align-items: center;
				gap: 1.25rem;
				padding: 1.5rem;
				background: var(--bg-secondary);
				border: 1px solid var(--border-color);
				border-radius: 12px;
				text-decoration: none;
				color: inherit;
				transition: var(--transition);
				cursor: pointer;
			}

			.tool-row:hover {
				border-color: var(--accent-color);
				box-shadow: var(--shadow-md);
				transform: translateY(-2px);
			}

			.tool-icon-row {
				font-size: 2rem;
				line-height: 1;
				flex-shrink: 0;
				width: 3rem;
				height: 3rem;
				display: flex;
				align-items: center;
				justify-content: center;
				background: var(--bg-primary);
				border-radius: 10px;
			}

			.tool-content {
				flex: 1;
				min-width: 0;
			}

			.tool-header {
				display: flex;
				align-items: center;
				gap: 0.75rem;
				margin-bottom: 0.375rem;
				flex-wrap: wrap;
			}

			.tool-title-row {
				font-size: 1.125rem;
				font-weight: 600;
				color: var(--text-primary);
				letter-spacing: -0.01em;
			}

			.tag {
				font-size: 0.75rem;
				font-weight: 500;
				padding: 0.25rem 0.625rem;
				background: var(--bg-primary);
				color: var(--text-secondary);
				border-radius: 6px;
				text-transform: uppercase;
				letter-spacing: 0.02em;
			}

			.tool-description-row {
				font-size: 0.9375rem;
				color: var(--text-secondary);
				line-height: 1.5;
			}

			.tool-arrow {
				font-size: 1.5rem;
				color: var(--text-tertiary);
				flex-shrink: 0;
				transition: var(--transition);
			}

			.tool-row:hover .tool-arrow {
				color: var(--accent-color);
				transform: translateX(4px);
			}

			/* No Results */
			.no-results {
				text-align: center;
				padding: 4rem 2rem;
			}

			.no-results-icon {
				font-size: 3rem;
				margin-bottom: 1rem;
				opacity: 0.5;
			}

			.no-results-text {
				font-size: 1.125rem;
				color: var(--text-secondary);
			}

			/* Footer */
			footer {
				text-align: center;
				padding: 2rem;
				margin-top: 4rem;
				border-top: 1px solid var(--border-color);
				color: var(--text-tertiary);
				font-size: 0.875rem;
			}

			/* Responsive Design */
			@media (max-width: 768px) {
				.nav-container {
					padding: 1rem 1.5rem;
				}

				.nav-links {
					gap: 1.5rem;
				}

				.container {
					padding: 2rem 1.5rem;
				}

				h1 {
					font-size: 2.25rem;
				}

				.subtitle {
					font-size: 1rem;
				}

				.tool-row {
					padding: 1.25rem;
					gap: 1rem;
				}

				.tool-icon-row {
					width: 2.5rem;
					height: 2.5rem;
					font-size: 1.75rem;
				}

				.tool-title-row {
					font-size: 1rem;
				}

				.tool-description-row {
					font-size: 0.875rem;
				}
			}

			@media (max-width: 480px) {
				.nav-links {
					gap: 1rem;
					font-size: 0.875rem;
				}

				h1 {
					font-size: 1.875rem;
				}

				.section-title {
					font-size: 1.25rem;
				}

				.tool-arrow {
					display: none;
				}
			}

			/* Animations */
			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(10px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			.tool-row {
				animation: fadeIn 0.3s ease-out;
			}

			/* Hidden state for search */
			.tool-row.hidden {
				display: none;
			}

			/* Filter Pills */
			.filter-pills {
				display: flex;
				gap: 0.5rem;
				margin-bottom: 1.5rem;
				flex-wrap: wrap;
			}

			.pill {
				padding: 0.5rem 1.25rem;
				border: 1px solid var(--border-color);
				border-radius: 20px;
				background: var(--bg-secondary);
				color: var(--text-secondary);
				font-size: 0.875rem;
				font-weight: 500;
				cursor: pointer;
				transition: var(--transition);
				font-family: inherit;
			}

			.pill:hover {
				border-color: var(--accent-color);
				color: var(--text-primary);
			}

			.pill.active {
				background: var(--accent-color);
				border-color: var(--accent-color);
				color: var(--bg-primary);
			}

			/* Category Sections */
			.category-section {
				margin-bottom: 2.5rem;
			}

			.category-title {
				font-size: 0.8rem;
				font-weight: 600;
				color: var(--text-tertiary);
				letter-spacing: 0.08em;
				text-transform: uppercase;
				margin-bottom: 1rem;
			}

			.category-section.hidden {
				display: none;
			}
		</style>
	</head>
	<body>
		<nav>
			<div class="nav-container">
				<a href="/" class="nav-brand">aditya n</a>
				<ul class="nav-links">
					<li><a href="/" class="active">Tools</a></li>
					<li><a href="about.html">About</a></li>
					<li>
						<a
							href="https://github.com/adityanatraj"
							target="_blank"
							rel="noopener noreferrer"
							>GitHub</a
						>
					</li>
				</ul>
			</div>
		</nav>

		<div class="container">
			<header>
				<h1>Tools</h1>
				<p class="subtitle">A collection of simple, (useful?) web toys</p>
			</header>

			<main>
				<div class="section-header">
					<div class="filter-pills">
						<button class="pill active" data-filter="all">All</button>
						<button class="pill" data-filter="tools">Tools</button>
						<button class="pill" data-filter="games">Games</button>
						<button class="pill" data-filter="learn">Learn</button>
					</div>
					<div class="search-box">
						<input
							type="text"
							id="searchInput"
							placeholder="Search..."
							autocomplete="off"
						/>
					</div>
				</div>

				<div class="category-section" data-category="tools">
					<h2 class="category-title">Tools</h2>
					<div class="tools-list" id="list-tools"></div>
				</div>
				<div class="category-section" data-category="games">
					<h2 class="category-title">Games</h2>
					<div class="tools-list" id="list-games"></div>
				</div>
				<div class="category-section" data-category="learn">
					<h2 class="category-title">Learn</h2>
					<div class="tools-list" id="list-learn"></div>
				</div>

				<div id="noResults" class="no-results" style="display: none">
					<div class="no-results-icon">🔍</div>
					<div class="no-results-text">No results matching your search</div>
				</div>
			</main>

			<footer>
				<p>© Aditya N</p>
			</footer>
		</div>

		<script>
			const tools = [
				{
					href: "tools/web/tools/upc_scanner.html",
					icon: "🔍",
					title: "UPC Scanner",
					tag: "Utility",
					category: "tools",
					description:
						"Scan barcodes and UPC codes with your camera. Keeps a running list of all codes found.",
					tags: "utility barcode upc ean scanner camera",
				},
				{
					href: "tools/web/tools/qr_coder.html",
					icon: "📱",
					title: "QR Code Generator",
					tag: "Utility",
					category: "tools",
					description:
						"Generate QR codes from URLs. Simple and fast QR code creation.",
					tags: "utility qr code generator url",
				},
				{
					href: "tools/web/tools/timezone_overlap.html",
					icon: "🌍",
					title: "Timezone Overlap",
					tag: "Utility",
					category: "tools",
					description:
						"Schedule across time zones. See working-hours overlap at a glance for distributed teams.",
					tags: "utility timezone schedule overlap time work remote team",
				},
				{
					href: "tools/web/games/yahtzee.html",
					icon: "🎲",
					title: "Yahtzee",
					tag: "Game",
					category: "games",
					description:
						"Play Yahtzee locally. Multiplayer dice game with peer-to-peer connection.",
					tags: "game dice multiplayer yahtzee",
				},
				{
					href: "tools/web/games/hangman.html",
					icon: "🎯",
					title: "Hangman",
					tag: "Game",
					category: "games",
					description:
						"Classic word guessing game for two players. Guess the secret word before running out of tries.",
					tags: "game word puzzle hangman two player offline",
				},
				{
					href: "tools/web/games/checkers.html",
					icon: "♟",
					title: "Checkers",
					tag: "Game",
					category: "games",
					description:
						"Classic checkers for two players. Pass-and-play with kings, multi-jumps, and save/restore.",
					tags: "game checkers draughts board two player offline",
				},
				{
					href: "tools/web/learn/vietnamese_conversations.html",
					icon: "🇻🇳",
					title: "Vietnamese Conversations",
					tag: "Language",
					category: "learn",
					description:
						"Learn Vietnamese through common conversations. Practice everyday phrases and dialogues.",
					tags: "language learning vietnamese education",
				},
				{
					href: "tools/web/learn/vietnamese_hotel.html",
					icon: "🏨",
					title: "Vietnamese Hotel Conversations",
					tag: "Language",
					category: "learn",
					description:
						"Learn hotel-specific Vietnamese phrases. Essential conversations for travelers.",
					tags: "language learning vietnamese hotel travel education",
				},
				{
					href: "tools/web/learn/italian-guide.html",
					icon: "🇮🇹",
					title: "Italian for Travelers",
					tag: "Language",
					category: "learn",
					description:
						"Essential Italian phrases for travelers. Common expressions to help you get around Italy.",
					tags: "language learning italian travel education",
				},
				{
					href: "tools/web/learn/rome-day-guide.html.html",
					icon: "🏛️",
					title: "Rome — One Perfect Day",
					tag: "Travel",
					category: "learn",
					description:
						"A curated one-day itinerary for Rome. Walk the city's highlights in a single perfect day.",
					tags: "travel rome italy guide itinerary education",
				},
				{
					href: "tools/web/learn/vatican-tour-guide.html",
					icon: "⛪",
					title: "Vatican Deep Dive Tour Guide",
					tag: "Travel",
					category: "learn",
					description:
						"An in-depth tour guide for the Vatican. Explore the history, art, and architecture of the world's smallest country.",
					tags: "travel vatican rome italy guide tour education",
				},
				{
					href: "tools/web/learn/naples-guide.html",
					icon: "🍕",
					title: "Naples — A Field Guide",
					tag: "Travel",
					category: "learn",
					description:
						"A practical field guide to Naples. Food, neighborhoods, culture, and everything you need to explore the city.",
					tags: "travel naples italy guide food culture education",
				},
				{
					href: "tools/web/learn/vesuvian-coast-guide.html",
					icon: "🌋",
					title: "The Vesuvian Coast — A Deep Dive",
					tag: "Travel",
					category: "learn",
					description:
						"Explore the towns and ruins buried by Vesuvius. A deep dive into the history and landscapes of the Vesuvian coast.",
					tags: "travel vesuvius pompeii herculaneum italy coast guide history education",
				},
				{
					href: "tools/web/learn/pompeii-day-guide.html",
					icon: "🏺",
					title: "Pompeii — Field Guide",
					tag: "Travel",
					category: "learn",
					description:
						"A field guide to Pompeii. Navigate the ancient city's ruins with context on what you're seeing and how to make the most of a visit.",
					tags: "travel pompeii vesuvius italy ruins history guide education",
				},
			];

			const categories = ["tools", "games", "learn"];

			categories.forEach((cat) => {
				const list = document.getElementById(`list-${cat}`);
				list.innerHTML = tools
					.filter((t) => t.category === cat)
					.map(
						(t) => `
					<a href="${t.href}" class="tool-row" data-title="${t.title}" data-description="${t.description}" data-tags="${t.tags}">
						<div class="tool-icon-row">${t.icon}</div>
						<div class="tool-content">
							<div class="tool-header">
								<h3 class="tool-title-row">${t.title}</h3>
								<span class="tag">${t.tag}</span>
							</div>
							<p class="tool-description-row">${t.description}</p>
						</div>
						<div class="tool-arrow">→</div>
					</a>`,
					)
					.join("");
			});

			const noResults = document.getElementById("noResults");
			const searchInput = document.getElementById("searchInput");
			const pills = document.querySelectorAll(".pill");
			const categorySections = document.querySelectorAll(".category-section");

			let activeFilter = "all";

			function applyFilter() {
				const term = searchInput.value.toLowerCase().trim();
				let anyVisible = false;

				categorySections.forEach((section) => {
					const catId = section.dataset.category;
					if (activeFilter !== "all" && activeFilter !== catId) {
						section.classList.add("hidden");
						return;
					}

					const rows = section.querySelectorAll(".tool-row");
					let count = 0;
					rows.forEach((row) => {
						const matches =
							term === "" ||
							["title", "description", "tags"].some((k) =>
								row.dataset[k]?.toLowerCase().includes(term),
							);
						row.classList.toggle("hidden", !matches);
						if (matches) count++;
					});

					if (count === 0 && term !== "") {
						section.classList.add("hidden");
					} else {
						section.classList.remove("hidden");
						anyVisible = true;
					}
				});

				noResults.style.display =
					!anyVisible && term !== "" ? "block" : "none";
			}

			pills.forEach((pill) => {
				pill.addEventListener("click", () => {
					pills.forEach((p) => p.classList.remove("active"));
					pill.classList.add("active");
					activeFilter = pill.dataset.filter;
					applyFilter();
				});
			});

			function debounce(func, wait) {
				let timeout;
				return function (...args) {
					clearTimeout(timeout);
					timeout = setTimeout(() => func(...args), wait);
				};
			}

			searchInput.addEventListener(
				"input",
				debounce(() => applyFilter(), 150),
			);
			applyFilter();
		</script>
	</body>
</html>
