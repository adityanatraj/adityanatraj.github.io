<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Yahtzee – Two Players</title>

<!--
===============================================================================
PLAN
===============================================================================
1. Consolidate both players into a single shared score table
   - Categories as rows
   - Player 1 + Player 2 as columns
   - Active player column highlighted

2. Improve scorecard visual hierarchy
   - Upper section and lower section clearly separated
   - Section headers
   - Totals bolded and visually distinct

3. Layout polish
   - Vertical stack of Save / Load / New buttons
   - Slightly softer, more board-game-like look
   - Clear affordances for clickable score cells

4. Functional improvements
   - Better disabled states
   - Cleaner turn indication
   - Minor animation polish
===============================================================================
-->

<style>
:root {
  --bg: #020617;
  --panel: #0f172a;
  --card: #111827;
  --line: #334155;
  --accent: #38bdf8;
  --accent2: #22c55e;
  --text: #e5e7eb;
  --muted: #94a3b8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: radial-gradient(circle at top, #020617, #020617);
  color: var(--text);
}

header {
  padding: 12px 16px;
  background: #020617;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  font-size: 18px;
  margin: 0;
}

.controls {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

button {
  background: var(--accent);
  border: none;
  color: #020617;
  padding: 8px 12px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}

button.secondary {
  background: #334155;
  color: var(--text);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

main {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 12px;
  padding: 12px;
}

@media (max-width: 900px) {
  main {
    grid-template-columns: 1fr;
  }
}

.scorecard {
  background: var(--card);
  border-radius: 14px;
  padding: 12px;
}

.scorecard table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.scorecard th,
.scorecard td {
  padding: 6px;
  border-bottom: 1px solid var(--line);
}

.scorecard th {
  text-align: center;
  font-weight: 700;
}

.scorecard th.player.active {
  color: var(--accent);
}

.scorecard td.label {
  color: var(--muted);
}

.scorecard td.score {
  text-align: center;
  cursor: pointer;
}

.scorecard td.score.used {
  color: var(--accent2);
  cursor: default;
}

.scorecard tr.section td {
  padding-top: 10px;
  font-weight: 700;
  color: var(--text);
  border-bottom: 2px solid var(--line);
}

.scorecard tr.total td {
  font-weight: 800;
  border-top: 2px solid var(--line);
}

.player-name {
  background: transparent;
  border: none;
  color: var(--text);
  font-weight: 700;
  text-align: center;
  width: 100%;
}

.play-area {
  background: var(--panel);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.turn-indicator {
  font-weight: 700;
  margin-bottom: 8px;
  text-align: center;
}

.dice-container {
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  margin: 16px 0;
}

.die {
  width: 70px;
  height: 70px;
  background: #f8fafc;
  color: #020617;
  border-radius: 14px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 30px;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.die.held {
  box-shadow: 0 0 0 4px var(--accent);
  transform: scale(0.94);
}

.controls-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.roll-info {
  color: var(--muted);
}
</style>
</head>

<body>
<header>
  <h1>Yahtzee (2 Players)</h1>
  <div class="controls">
    <button class="secondary" onclick="saveGame()">Save</button>
    <button class="secondary" onclick="loadGame()">Load</button>
    <button onclick="newGame()">New Game</button>
  </div>
</header>

<main>
  <div class="scorecard" id="scorecard"></div>

  <div class="play-area">
    <div class="turn-indicator" id="turnIndicator"></div>
    <div class="dice-container" id="diceContainer"></div>
    <div class="controls-row">
      <div class="roll-info" id="rollInfo"></div>
      <button id="rollBtn" onclick="rollDice()">Roll Dice</button>
    </div>
  </div>
</main>

<script>
/* ============================================================================
   GAME DATA
============================================================================ */
const CATEGORIES = [
  { key: "ones", label: "Ones", upper: true },
  { key: "twos", label: "Twos", upper: true },
  { key: "threes", label: "Threes", upper: true },
  { key: "fours", label: "Fours", upper: true },
  { key: "fives", label: "Fives", upper: true },
  { key: "sixes", label: "Sixes", upper: true },
  { key: "threeKind", label: "3 of a Kind" },
  { key: "fourKind", label: "4 of a Kind" },
  { key: "fullHouse", label: "Full House" },
  { key: "smallStraight", label: "Small Straight" },
  { key: "largeStraight", label: "Large Straight" },
  { key: "yahtzee", label: "Yahtzee" },
  { key: "chance", label: "Chance" }
];

let gameState;

/* ============================================================================
   INIT
============================================================================ */
function newGame() {
  gameState = {
    players: [
      { name: "Player 1", scores: {}, yahtzeeBonus: 0 },
      { name: "Player 2", scores: {}, yahtzeeBonus: 0 }
    ],
    currentPlayer: 0,
    dice: Array.from({ length: 5 }, () => ({ value: 1, held: false })),
    rollsLeft: 3
  };
  render();
}
newGame();

/* ============================================================================
   RENDER
============================================================================ */
function render() {
  renderScorecard();
  renderDice();
  renderControls();
}

function renderScorecard() {
  const el = document.getElementById("scorecard");
  el.innerHTML = "";

  const table = document.createElement("table");

  // Header
  const head = document.createElement("tr");
  head.innerHTML = `
    <th></th>
    <th class="player ${gameState.currentPlayer===0?"active":""}">
      <input class="player-name" value="${gameState.players[0].name}"
        onchange="gameState.players[0].name=this.value">
    </th>
    <th class="player ${gameState.currentPlayer===1?"active":""}">
      <input class="player-name" value="${gameState.players[1].name}"
        onchange="gameState.players[1].name=this.value">
    </th>`;
  table.appendChild(head);

  table.appendChild(sectionRow("Upper Section"));

  CATEGORIES.filter(c=>c.upper).forEach(c=>addCategoryRow(table,c));

  table.appendChild(totalRow("Upper Total", p=>calcTotals(p).upper));
  table.appendChild(totalRow("Upper Bonus", p=>calcTotals(p).upperBonus));

  table.appendChild(sectionRow("Lower Section"));

  CATEGORIES.filter(c=>!c.upper).forEach(c=>addCategoryRow(table,c));

  table.appendChild(totalRow("Lower Total", p=>calcTotals(p).lower));
  table.appendChild(totalRow("Grand Total", p=>calcTotals(p).grand));

  el.appendChild(table);
}

function sectionRow(label) {
  const tr = document.createElement("tr");
  tr.className = "section";
  tr.innerHTML = `<td colspan="3">${label}</td>`;
  return tr;
}

function totalRow(label, fn) {
  const tr = document.createElement("tr");
  tr.className = "total";
  tr.innerHTML = `
    <td>${label}</td>
    <td style="text-align:center">${fn(gameState.players[0])}</td>
    <td style="text-align:center">${fn(gameState.players[1])}</td>`;
  return tr;
}

function addCategoryRow(table, cat) {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="label">${cat.label}</td>`;
  gameState.players.forEach((p, i) => {
    const td = document.createElement("td");
    td.className = "score";
    const val = p.scores[cat.key];
    if (val != null) {
      td.textContent = val;
      td.classList.add("used");
    } else if (i === gameState.currentPlayer && gameState.rollsLeft < 3) {
      td.textContent = previewScore(cat.key);
      td.onclick = () => assignScore(cat.key);
    }
    tr.appendChild(td);
  });
  table.appendChild(tr);
}

function renderDice() {
  const c = document.getElementById("diceContainer");
  c.innerHTML = "";
  gameState.dice.forEach(d=>{
    const el = document.createElement("div");
    el.className = "die" + (d.held?" held":"");
    el.textContent = d.value;
    el.onclick = ()=>{
      if (gameState.rollsLeft<3) {
        d.held=!d.held;
        renderDice();
      }
    };
    c.appendChild(el);
  });
}

function renderControls() {
  document.getElementById("turnIndicator").textContent =
    `${gameState.players[gameState.currentPlayer].name}'s Turn`;
  document.getElementById("rollInfo").textContent =
    `Rolls left: ${gameState.rollsLeft}`;
  document.getElementById("rollBtn").disabled = gameState.rollsLeft===0;
}

/* ============================================================================
   GAMEPLAY
============================================================================ */
function rollDice() {
  if (!gameState.rollsLeft) return;
  gameState.dice.forEach(d=>{
    if(!d.held) d.value = Math.floor(Math.random()*6)+1;
  });
  gameState.rollsLeft--;
  render();
}

function assignScore(cat) {
  const p = gameState.players[gameState.currentPlayer];
  if (p.scores[cat]!=null) return;
  p.scores[cat] = calcScore(cat);
  endTurn();
}

function endTurn() {
  gameState.dice.forEach(d=>d.held=false);
  gameState.rollsLeft=3;
  gameState.currentPlayer=1-gameState.currentPlayer;
  render();
}

/* ============================================================================
   SCORING
============================================================================ */
function calcScore(cat) {
  const v = gameState.dice.map(d=>d.value);
  const c = count(v);
  const s = v.reduce((a,b)=>a+b,0);
  switch(cat){
    case"ones":return c[1]*1;
    case"twos":return c[2]*2;
    case"threes":return c[3]*3;
    case"fours":return c[4]*4;
    case"fives":return c[5]*5;
    case"sixes":return c[6]*6;
    case"threeKind":return has(c,3)?s:0;
    case"fourKind":return has(c,4)?s:0;
    case"fullHouse":return fh(c)?25:0;
    case"smallStraight":return ss(v)?30:0;
    case"largeStraight":return ls(v)?40:0;
    case"yahtzee":return has(c,5)?50:0;
    case"chance":return s;
  }
}
const previewScore = calcScore;
const count = v => v.reduce((a,x)=>(a[x]=(a[x]||0)+1,a),{});
const has = (c,n)=>Object.values(c).some(x=>x>=n);
const fh = c=>Object.values(c).includes(3)&&Object.values(c).includes(2);
const ss = v=>[[1,2,3,4],[2,3,4,5],[3,4,5,6]].some(s=>s.every(x=>v.includes(x)));
const ls = v=>["1,2,3,4,5","2,3,4,5,6"].includes([...new Set(v)].sort().join());

function calcTotals(p){
  let u=0,l=0;
  CATEGORIES.forEach(c=>{
    const v=p.scores[c.key];
    if(v!=null) c.upper?u+=v:l+=v;
  });
  const ub=u>=63?35:0;
  return {upper:u,upperBonus:ub,lower:l,grand:u+ub+l};
}

/* ============================================================================
   SAVE / LOAD
============================================================================ */
function saveGame() {
  const blob=new Blob([JSON.stringify(gameState,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="yahtzee-game.json";
  a.click();
}
function loadGame() {
  const i=document.createElement("input");
  i.type="file";i.accept="application/json";
  i.onchange=e=>{
    const r=new FileReader();
    r.onload=()=>{gameState=JSON.parse(r.result);render();};
    r.readAsText(e.target.files[0]);
  };
  i.click();
}
</script>
</body>
</html>
