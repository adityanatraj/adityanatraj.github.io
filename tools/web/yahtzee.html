<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<title>Yahtzee</title>

		<style>
			:root {
				--bg: #020617;
				--panel: #0f172a;
				--card: #111827;
				--line: #334155;
				--accent: #38bdf8;
				--accent2: #22c55e;
				--text: #e5e7eb;
				--text-accent: #efefef;
				--muted: #94a3b8;
				--danger: #ef4444;
				--die-face: #f8fafc;
				--die-accent: #fabc3cee;
				--line-hover: #3d4f63;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				font-family:
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					sans-serif;
				background: var(--bg);
				color: var(--text);
			}

			header {
				padding: 12px 16px;
				background: var(--bg);
				display: flex;
				flex-direction: column;
				gap: 10px;
			}

			.header-top {
				display: flex;
				align-items: center;
			}

			header h1 {
				font-size: 18px;
				margin: 0;
				flex: 1;
				text-align: center;
			}

			.back-link {
				color: var(--muted);
				text-decoration: none;
				font-size: 0.8rem;
				font-weight: 500;
				transition: color 0.2s;
				white-space: nowrap;
			}

			.back-link:hover {
				color: var(--accent);
			}

			.menu-toggle {
				background: transparent;
				color: var(--muted);
				font-size: 18px;
				font-weight: 400;
				min-width: unset;
				min-height: unset;
				padding: 4px 6px;
				line-height: 1;
			}

			.menu-toggle:hover:not(:disabled) {
				color: var(--accent);
				opacity: 1;
			}

			.menu-toggle:active:not(:disabled) {
				box-shadow: none;
			}

			.controls {
				margin-top: 6px;
				display: none;
				gap: 8px;
			}

			.controls.open {
				display: flex;
			}

			.controls button {
				flex: 1;
			}

			button {
				background: var(--accent);
				border: none;
				color: var(--bg);
				border-radius: 6px;
				font-weight: 600;
				cursor: pointer;
				transition:
					transform 0.1s ease,
					box-shadow 0.1s ease;
				touch-action: manipulation;
				min-width: 48px;
				min-height: 32px;
			}

			button:hover:not(:disabled) {
				opacity: 0.85;
			}

			button:active:not(:disabled) {
				transform: scale(0.95);
				box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
			}

			button.secondary {
				background: var(--line);
				color: var(--text);
			}

			button.secondary:hover:not(:disabled) {
				opacity: 1;
				background: var(--line-hover);
			}

			button.secondary:active:not(:disabled) {
				box-shadow: 0 2px 8px rgba(51, 65, 85, 0.4);
			}

			button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}

			main {
				display: grid;
				grid-template-columns: 1.2fr 0.8fr;
				gap: 8px;
				padding: 8px;
				padding-bottom: calc(16px + env(safe-area-inset-bottom));
			}

			footer {
				text-align: center;
				border-top: 1px solid var(--border-color);
				color: var(--text-tertiary);
				font-size: 0.875rem;
			}

			@media (max-width: 900px) {
				main {
					grid-template-columns: 1fr;
				}
				.play-area {
					order: -1;
				}
			}

			.scorecard {
				background: var(--card);
				border-radius: 10px;
			}

			.scorecard table {
				width: 100%;
				border-collapse: collapse;
				font-size: 14px;
			}

			.scorecard th,
			.scorecard td {
				padding: 10px 8px;
				border-bottom: 1px dashed var(--line);
			}

			.scorecard th {
				text-align: center;
				font-weight: 700;
			}

			.scorecard th.player.active {
				color: var(--accent);
			}

			.scorecard td.label {
				color: var(--muted);
			}

			.scorecard td.score {
				text-align: center;
				cursor: pointer;
				transition:
					background-color 0.1s ease,
					transform 0.1s ease;
				touch-action: manipulation;
				min-width: 48px;
			}

			@media (hover: none) {
				.scorecard td.score {
					min-height: 44px;
				}
			}

			.scorecard td.score:not(.used):hover {
				background-color: rgba(56, 189, 248, 0.1);
			}

			.scorecard td.score:not(.used):active {
				background-color: rgba(56, 189, 248, 0.2);
				transform: scale(0.98);
			}

			.scorecard td.score.used {
				cursor: default;
			}

			.scorecard td.score.used.at-par {
				color: var(--accent2);
			}

			.scorecard td.score.used.below-par {
				color: var(--danger);
			}

			.scorecard td.score.preview {
				color: var(--muted);
				font-style: italic;
			}

			@keyframes scoreFlash {
				from {
					background-color: rgba(56, 189, 248, 0.35);
				}
				to {
					background-color: transparent;
				}
			}

			.scorecard td.score.scored-flash {
				animation: scoreFlash 0.5s ease-out forwards;
			}

			.scorecard tr.section td {
				padding-top: 2px;
				padding-bottom: 4px;
				font-weight: 700;
				color: var(--text-accent);
				background-color: var(--bg);
				border-bottom: 1px dashed var(--line);
			}

			.scorecard tr.total td {
				font-weight: 800;
				text-align: center;
				border-top: 2px solid var(--line);
				border-bottom: 2px solid var(--line);
			}

			.scorecard tr.total td:first-child {
				text-align: left;
			}

			.player-name {
				background: transparent;
				border: none;
				border-bottom: 1px solid transparent;
				color: var(--text);
				font-weight: 700;
				font-size: 16px;
				text-align: center;
				width: 100%;
				outline: none;
				transition: border-color 0.2s;
			}

			.player-name:focus {
				border-bottom-color: var(--accent);
			}

			.play-area {
				background: var(--panel);
				border-radius: 10px;
				padding: 14px;
				gap: 10px;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
			}

			.bottom-padding {
				height: env(safe-area-inset-bottom);
			}

			.turn-indicator {
				font-weight: 700;
				margin-bottom: 8px;
				text-align: center;
			}

			.dice-container {
				display: flex;
				justify-content: center;
				gap: 10px;
				flex-wrap: wrap;
				margin: 0px 0;
			}

			.die {
				width: 70px;
				height: 70px;
				background: var(--die-face);
				color: var(--bg);
				border-radius: 8px;
				display: flex;
				justify-content: center;
				align-items: center;
				padding-bottom: 11px;
				padding-right: 1px;
				font-size: 80px;
				cursor: pointer;
				transition:
					transform 0.15s ease,
					box-shadow 0.15s ease;
				touch-action: manipulation;
				user-select: none;
			}

			.die.held {
				background-color: var(--die-accent);
				transform: scale(0.94);
			}

			.die.unrolled {
				opacity: 0.3;
				cursor: default;
			}

			@keyframes dieRoll {
				0%,
				100% {
					transform: rotate(0deg) scale(1);
				}
				25% {
					transform: rotate(-10deg) scale(1.08);
				}
				75% {
					transform: rotate(10deg) scale(1.08);
				}
			}

			.die.rolling {
				animation: dieRoll 0.2s ease;
			}

			.die:not(.unrolled):active {
				transform: scale(0.88);
			}

			.controls-row {
				display: flex;
				justify-content: space-between;
				align-items: center;
			}

			.modal {
				display: none;
				position: fixed;
				z-index: 1000;
				left: 0;
				top: 0;
				width: 100%;
				height: 100%;
				background: rgba(0, 0, 0, 0.8);
				justify-content: center;
				align-items: center;
			}

			.modal.show {
				display: flex;
			}

			.modal-content {
				background: var(--card);
				border-radius: 16px;
				padding: 32px;
				width: min(500px, calc(100vw - 32px));
				max-height: 85vh;
				overflow-y: auto;
				text-align: center;
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
			}

			.modal-content h2 {
				margin: 0 0 20px 0;
				color: var(--accent);
				font-size: 28px;
			}

			.modal-content button {
				margin-top: 20px;
				padding: 12px 24px;
				font-size: 16px;
			}

			#winnerScores {
				margin: 20px 0;
				font-size: 18px;
				line-height: 1.8;
			}

			.score-line {
				padding: 8px;
				border-radius: 8px;
				margin: 4px 0;
			}

			.score-line.winner {
				background: rgba(56, 189, 248, 0.2);
				font-weight: 700;
			}

			.modal-actions {
				display: flex;
				gap: 10px;
				justify-content: center;
				margin-top: 20px;
			}

			.stats-preview {
				text-align: left;
				margin: 20px 0;
				padding: 16px;
				background: var(--panel);
				border-radius: 8px;
			}
		</style>
	</head>

	<body>
		<header>
			<div class="header-top">
				<a class="back-link" href="/">← Tools</a>
				<h1>Yahtzee</h1>
				<button class="menu-toggle" id="menuToggle" onclick="toggleMenu()">
					☰
				</button>
			</div>
			<div class="controls">
				<button class="secondary" onclick="showStatsModal()">Stats</button>
				<button class="secondary" onclick="saveGame()">Save</button>
				<button class="secondary" onclick="loadGame()">Load</button>
				<button onclick="newGame()">New Game</button>
			</div>
		</header>

		<main>
			<div class="scorecard" id="scorecard"></div>

			<div class="play-area">
				<div class="turn-indicator" id="turnIndicator"></div>
				<div class="dice-container" id="diceContainer"></div>
				<div class="controls-row">
					<button id="rollBtn" onclick="rollDice()">Roll Dice</button>
				</div>
			</div>
		</main>

		<div id="winnerModal" class="modal">
			<div class="modal-content">
				<h2 id="winnerTitle"></h2>
				<div id="winnerScores"></div>
				<div class="modal-actions">
					<button class="secondary" onclick="closeWinnerModal()">Close</button>
					<button onclick="startNewGameFromModal()">Start New Game</button>
				</div>
			</div>
		</div>

		<div id="statsModal" class="modal">
			<div class="modal-content">
				<div id="statsContent"></div>
				<div class="modal-actions">
					<button class="secondary" onclick="clearPastGames()">Clear Stats</button>
					<button onclick="closeStatsModal()">Close</button>
				</div>
			</div>
		</div>

		<div id="statsLoadModal" class="modal">
			<div class="modal-content">
				<h2>Load Past Games</h2>
				<p style="color: var(--muted); margin: 16px 0">
					This save file contains past game records. What would you like to do?
				</p>
				<div id="statsLoadPreview" class="stats-preview"></div>
				<div class="modal-actions">
					<button class="secondary" onclick="handlePastGamesLoad('replace')">
						Replace All
					</button>
					<button onclick="handlePastGamesLoad('merge')">Merge</button>
					<button class="secondary" onclick="handlePastGamesLoad('skip')">
						Keep Current
					</button>
				</div>
			</div>
		</div>

		<script>
			/* ============================================================================
			   GAME DATA
			============================================================================ */
			const CATEGORIES = [
				{ key: "ones", label: "Ones", upper: true, par: 3 },
				{ key: "twos", label: "Twos", upper: true, par: 6 },
				{ key: "threes", label: "Threes", upper: true, par: 9 },
				{ key: "fours", label: "Fours", upper: true, par: 12 },
				{ key: "fives", label: "Fives", upper: true, par: 15 },
				{ key: "sixes", label: "Sixes", upper: true, par: 18 },
				{ key: "threeKind", label: "3 of a Kind" },
				{ key: "fourKind", label: "4 of a Kind" },
				{ key: "fullHouse", label: "Full House" },
				{ key: "smallStraight", label: "Sm. Str." },
				{ key: "largeStraight", label: "Lg. Str." },
				{ key: "yahtzee", label: "Yahtzee" },
				{ key: "chance", label: "Chance" },
			];

			let gameState;
			let flashCell = null;

			/* ============================================================================
			   INIT
			============================================================================ */
			function newGame() {
				const gameInProgress =
					gameState &&
					gameState.players &&
					!gameState.gameEnded &&
					gameState.players.some((p) => Object.keys(p.scores).length > 0);
				if (
					gameInProgress &&
					!confirm("Start a new game? Current progress will be lost.")
				)
					return;

				let playerNames = ["Player 1", "Player 2"];

				// Preserve and reorder players if there's an existing game
				if (gameState && gameState.players) {
					playerNames = [...gameState.players]
						.sort((a, b) => calcTotals(b).grand - calcTotals(a).grand)
						.map((p) => p.name);
				}

				gameState = {
					players: [
						{ name: playerNames[0], scores: {} },
						{ name: playerNames[1], scores: {} },
					],
					currentPlayer: 0,
					dice: Array.from({ length: 5 }, () => ({
						value: 1,
						held: false,
						rolling: false,
					})),
					rollsLeft: 3,
					gameEnded: false,
					startedAt: new Date().toISOString(),
					endedAt: null,
				};
				render();
			}
			newGame();

			/* ============================================================================
			   RENDER
			============================================================================ */
			function render() {
				renderScorecard();
				renderDice();
				renderControls();
			}

			function renderScorecard() {
				const el = document.getElementById("scorecard");
				el.innerHTML = "";

				const esc = (s) => s.replace(/&/g, "&amp;").replace(/"/g, "&quot;");
				const table = document.createElement("table");

				// Header
				const head = document.createElement("tr");
				head.innerHTML = `
			    <th></th>
			    <th class="player ${gameState.currentPlayer === 0 ? "active" : ""}">
			      <input class="player-name" value="${esc(gameState.players[0].name)}"
			        onchange="gameState.players[0].name=this.value">
			    </th>
			    <th class="player ${gameState.currentPlayer === 1 ? "active" : ""}">
			      <input class="player-name" value="${esc(gameState.players[1].name)}"
			        onchange="gameState.players[1].name=this.value">
			    </th>`;
				table.appendChild(head);

				table.appendChild(sectionRow("Top"));

				CATEGORIES.filter((c) => c.upper).forEach((c) =>
					addCategoryRow(table, c),
				);

				table.appendChild(totalRow("Top Total", (p) => calcTotals(p).upper));
				table.appendChild(totalRow("Bonus", (p) => calcTotals(p).upperBonus));

				table.appendChild(sectionRow("Bottom"));

				// Add categories up to and including yahtzee
				CATEGORIES.filter((c) => !c.upper).forEach((c) => {
					addCategoryRow(table, c);
				});

				table.appendChild(totalRow("Bottom Total", (p) => calcTotals(p).lower));
				table.appendChild(totalRow("Grand Total", (p) => calcTotals(p).grand));

				el.appendChild(table);
			}

			function sectionRow(label) {
				const tr = document.createElement("tr");
				tr.className = "section";
				tr.innerHTML = `<td colspan="3">${label}</td>`;
				return tr;
			}

			function totalRow(label, fn) {
				const tr = document.createElement("tr");
				tr.className = "total";
				tr.innerHTML = `
			    <td>${label}</td>
			    <td>${fn(gameState.players[0])}</td>
			    <td>${fn(gameState.players[1])}</td>`;
				return tr;
			}

			function addCategoryRow(table, cat) {
				const tr = document.createElement("tr");
				tr.innerHTML = `<td class="label">${cat.label}</td>`;
				gameState.players.forEach((p, i) => {
					const td = document.createElement("td");
					td.className = "score";
					const val = p.scores[cat.key];
					if (val != null) {
						td.textContent = val;
						td.classList.add("used");

						if (
							flashCell &&
							flashCell.playerIndex === i &&
							flashCell.catKey === cat.key
						) {
							td.classList.add("scored-flash");
							flashCell = null;
						}

						// Apply color coding based on par (only for upper section)
						if (cat.par !== undefined) {
							if (val >= cat.par) {
								td.classList.add("at-par");
							} else {
								td.classList.add("below-par");
							}
						} else {
							td.classList.add(val > 0 ? "at-par" : "below-par");
						}
					} else if (i === gameState.currentPlayer && gameState.rollsLeft < 3) {
						td.textContent = calcScore(cat.key);
						td.classList.add("preview");
						td.onclick = () => assignScore(cat.key);
					}
					tr.appendChild(td);
				});
				table.appendChild(tr);
			}

			const PIPS = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

			function renderDice() {
				const c = document.getElementById("diceContainer");
				c.innerHTML = "";
				const unrolled = gameState.rollsLeft === 3;
				gameState.dice.forEach((d) => {
					const el = document.createElement("div");
					el.className =
						"die" +
						(d.held ? " held" : "") +
						(unrolled ? " unrolled" : "") +
						(d.rolling ? " rolling" : "");
					el.textContent = unrolled ? "·" : PIPS[d.value];
					el.onclick = () => {
						if (gameState.rollsLeft < 3) {
							d.held = !d.held;
							renderDice();
						}
					};
					c.appendChild(el);
				});
			}

			function renderControls() {
				document.getElementById("turnIndicator").textContent =
					`${gameState.players[gameState.currentPlayer].name}'s Turn (${gameState.rollsLeft} left)`;
				// document.getElementById("rollInfo").textContent =
				// 	`Rolls left: ${gameState.rollsLeft}`;
				document.getElementById("rollBtn").disabled = gameState.rollsLeft === 0;
			}

			/* ============================================================================
			   GAMEPLAY
			============================================================================ */
			function rollDice() {
				if (gameState.gameEnded || !gameState.rollsLeft) return;
				gameState.dice.forEach((d) => {
					if (!d.held) {
						d.value = Math.floor(Math.random() * 6) + 1;
						d.rolling = true;
					}
				});
				gameState.rollsLeft--;
				render();
				setTimeout(() => {
					gameState.dice.forEach((d) => (d.rolling = false));
					renderDice();
				}, 220);
			}

			function assignScore(cat) {
				if (gameState.gameEnded) return;
				const p = gameState.players[gameState.currentPlayer];
				if (p.scores[cat] != null) return;
				const score = calcScore(cat);
				const catLabel = CATEGORIES.find((c) => c.key === cat).label;
				if (!confirm(`Assign ${score} points to ${catLabel}?`)) return;
				flashCell = { playerIndex: gameState.currentPlayer, catKey: cat };
				p.scores[cat] = score;

				endTurn();
			}

			function endTurn() {
				gameState.dice.forEach((d) => {
					d.held = false;
					d.rolling = false;
				});
				gameState.rollsLeft = 3;
				gameState.currentPlayer = 1 - gameState.currentPlayer;
				render();
				checkGameEnd();
			}

			function checkGameEnd() {
				const allScored = gameState.players.every((p) =>
					CATEGORIES.every((c) => p.scores[c.key] != null),
				);
				if (allScored) {
					gameState.gameEnded = true;
					gameState.endedAt = new Date().toISOString();
					showWinnerModal();
				}
			}

			function showWinnerModal() {
				const scores = gameState.players
					.map((p) => ({ name: p.name, score: calcTotals(p).grand }))
					.sort((a, b) => b.score - a.score);

				const winner = scores[0];

				recordGame();

				document.getElementById("winnerTitle").textContent =
					`🏆 ${winner.name} Wins! 🏆`;

				const scoresHtml = scores
					.map(
						(s, i) => `
			    <div class="score-line ${i === 0 ? "winner" : ""}">
			      ${i + 1}. ${s.name}: ${s.score} points
			    </div>
			  `,
					)
					.join("");

				document.getElementById("winnerScores").innerHTML = scoresHtml;
				document.getElementById("winnerModal").classList.add("show");
			}

			function closeWinnerModal() {
				document.getElementById("winnerModal").classList.remove("show");
			}

			function startNewGameFromModal() {
				document.getElementById("winnerModal").classList.remove("show");
				newGame();
			}

			/* ============================================================================
			   SCORING
			============================================================================ */
			function calcScore(cat) {
				const v = gameState.dice.map((d) => d.value);
				const c = count(v);
				const s = v.reduce((a, b) => a + b, 0);
				let result;
				switch (cat) {
					case "ones":
						result = (c[1] || 0) * 1;
						break;
					case "twos":
						result = (c[2] || 0) * 2;
						break;
					case "threes":
						result = (c[3] || 0) * 3;
						break;
					case "fours":
						result = (c[4] || 0) * 4;
						break;
					case "fives":
						result = (c[5] || 0) * 5;
						break;
					case "sixes":
						result = (c[6] || 0) * 6;
						break;
					case "threeKind":
						result = has(c, 3) ? s : 0;
						break;
					case "fourKind":
						result = has(c, 4) ? s : 0;
						break;
					case "fullHouse":
						result = fh(c) ? 25 : 0;
						break;
					case "smallStraight":
						result = ss(v) ? 30 : 0;
						break;
					case "largeStraight":
						result = ls(v) ? 40 : 0;
						break;
					case "yahtzee":
						result = has(c, 5) ? 50 : 0;
						break;
					case "chance":
						result = s;
						break;
					default:
						result = 0;
				}
				// Ensure we always return a valid number, never NaN
				return typeof result === "number" && !isNaN(result) ? result : 0;
			}
			const count = (v) =>
				v.reduce((a, x) => ((a[x] = (a[x] || 0) + 1), a), {});
			const has = (c, n) => Object.values(c).some((x) => x >= n);
			const fh = (c) =>
				(Object.values(c).includes(3) && Object.values(c).includes(2)) ||
				Object.values(c).includes(5);
			const ss = (v) =>
				[
					[1, 2, 3, 4],
					[2, 3, 4, 5],
					[3, 4, 5, 6],
				].some((s) => s.every((x) => v.includes(x)));
			const ls = (v) =>
				["1,2,3,4,5", "2,3,4,5,6"].includes([...new Set(v)].sort().join());

			function calcTotals(p) {
				let u = 0,
					l = 0;
				CATEGORIES.forEach((c) => {
					const v = p.scores[c.key];
					if (v != null) {
						// Ensure we're adding valid numbers only
						const validValue = typeof v === "number" && !isNaN(v) ? v : 0;
						c.upper ? (u += validValue) : (l += validValue);
					}
				});
				const ub = u >= 63 ? 35 : 0;
				const grand = u + ub + l;
				// Defensive check to ensure totals are valid numbers
				return {
					upper: u,
					upperBonus: ub,
					lower: l,
					grand: grand,
				};
			}

			/* ============================================================================
			   SAVE / LOAD
			============================================================================ */
			function saveGame() {
				const saveData = {
					version: "1.3",
					savedAt: new Date().toISOString(),
					gameState: gameState,
					pastGames: getPastGames() || [],
				};

				const blob = new Blob([JSON.stringify(saveData, null, 2)], {
					type: "application/json",
				});
				const fname = "yahtzee-game.json";

				try {
					const file = new File([blob], fname, { type: "application/json" });
					if (navigator.share && navigator.canShare &&
						navigator.canShare({ files: [file] })) {
						navigator.share({ title: fname, files: [file] });
						return;
					}
				} catch (_) {}

				const a = document.createElement("a");
				a.href = URL.createObjectURL(blob);
				a.download = fname;
				a.click();
				setTimeout(() => URL.revokeObjectURL(a.href), 0);
			}

			function loadGame() {
				const i = document.createElement("input");
				i.type = "file";
				i.accept = "application/json";
				i.onchange = (e) => {
					const r = new FileReader();
					r.onload = () => {
						try {
							const data = JSON.parse(r.result);

							if (data.version) {
								gameState = data.gameState;
								// v1.3+: pastGames array; v1.2: statistics key — discard silently
								if (data.pastGames && data.pastGames.length > 0) {
									showPastGamesLoadModal(data.pastGames);
								}
							} else {
								// Pre-versioned format — data IS the gameState
								gameState = data;
							}

							render();
						} catch (err) {
							alert("Error loading save file: " + err.message);
							console.error("Load error:", err);
						}
					};
					r.readAsText(e.target.files[0]);
				};
				i.click();
			}

			/* ============================================================================
			   PAST GAMES
			============================================================================ */
			function getPastGames() {
				try {
					if (typeof localStorage === "undefined") return null;
					if (localStorage.getItem("yahtzeeStats") !== null) {
						localStorage.removeItem("yahtzeeStats");
					}
					const stored = localStorage.getItem("yahtzeeGames");
					return stored ? JSON.parse(stored) : [];
				} catch (e) {
					console.warn("localStorage unavailable:", e);
					return null;
				}
			}

			function savePastGames(games) {
				try {
					if (typeof localStorage === "undefined") return;
					localStorage.setItem("yahtzeeGames", JSON.stringify(games));
				} catch (e) {
					console.warn("Failed to save past games:", e);
				}
			}

			function recordGame() {
				const games = getPastGames();
				if (games === null) return;
				games.push({
					startedAt: gameState.startedAt,
					endedAt: gameState.endedAt,
					players: gameState.players.map((p) => ({
						name: p.name,
						scores: { ...p.scores },
						total: calcTotals(p).grand,
					})),
				});
				savePastGames(games);
			}

			function computeStats(games) {
				const playerWins = {};
				const playerTotals = {};
				let highestScore = { name: "", score: 0 };

				games.forEach((game) => {
					const maxTotal = Math.max(...game.players.map((p) => p.total));
					game.players.forEach((p) => {
						if (p.total === maxTotal) {
							playerWins[p.name] = (playerWins[p.name] || 0) + 1;
						}
						if (!playerTotals[p.name]) playerTotals[p.name] = [];
						playerTotals[p.name].push(p.total);
						if (p.total > highestScore.score) {
							highestScore = { name: p.name, score: p.total };
						}
					});
				});

				return { gamesPlayed: games.length, playerWins, playerTotals, highestScore };
			}

			function sanitizePastGames(arr) {
				if (!Array.isArray(arr)) return [];
				return arr.filter((g) => {
					if (!g || typeof g !== "object") return false;
					if (typeof g.startedAt !== "string") return false;
					if (!Array.isArray(g.players) || g.players.length === 0) return false;
					return g.players.every(
						(p) =>
							typeof p.name === "string" &&
							typeof p.scores === "object" &&
							p.scores !== null &&
							typeof p.total === "number" &&
							p.total >= 0,
					);
				});
			}

			function clearPastGames() {
				if (confirm("Clear all past games? This cannot be undone.")) {
					try {
						localStorage.removeItem("yahtzeeGames");
						showStatsModal();
					} catch (e) {
						console.warn("Failed to clear past games:", e);
					}
				}
			}

			function showStatsModal() {
				const games = getPastGames();
				const modal = document.getElementById("statsModal");
				const content = document.getElementById("statsContent");

				if (games === null) {
					content.innerHTML = `<p style="color:var(--muted)">Statistics unavailable — storage is disabled in this browser.</p>`;
					modal.classList.add("show");
					return;
				}

				let html = `<h3 style="margin-top:0">📊 Game Statistics</h3>`;

				if (games.length === 0) {
					html += `<p style="color: var(--muted); margin-top: 20px;">No games completed yet.</p>`;
					content.innerHTML = html;
					modal.classList.add("show");
					return;
				}

				const { gamesPlayed, playerWins, playerTotals, highestScore } = computeStats(games);

				html += `<p><strong>Total Games:</strong> ${gamesPlayed}</p>`;

				if (highestScore.score > 0) {
					html += `<p><strong>Highest Score:</strong> ${highestScore.name} — ${highestScore.score}</p>`;
				}

				if (Object.keys(playerWins).length > 0) {
					html += `<h4>Wins by Player</h4>`;
					Object.entries(playerWins)
						.sort((a, b) => b[1] - a[1])
						.forEach(([name, wins]) => {
							html += `<p>${name}: ${wins} win${wins !== 1 ? "s" : ""}</p>`;
						});
				}

				if (Object.keys(playerTotals).length > 0) {
					html += `<h4>Average Scores</h4>`;
					Object.entries(playerTotals).forEach(([name, totals]) => {
						const avg = Math.round(totals.reduce((a, b) => a + b, 0) / totals.length);
						html += `<p>${name}: ${avg} (${totals.length} game${totals.length !== 1 ? "s" : ""})</p>`;
					});
				}

				content.innerHTML = html;
				modal.classList.add("show");
			}

			function closeStatsModal() {
				document.getElementById("statsModal").classList.remove("show");
			}

			/* ============================================================================
			   PAST GAMES LOADING & MERGING
			============================================================================ */
			let pendingLoadedGames = null;

			function showPastGamesLoadModal(loadedGames) {
				const sanitized = sanitizePastGames(loadedGames);
				if (sanitized.length === 0) return;

				pendingLoadedGames = sanitized;
				const currentGames = getPastGames() || [];
				const loaded = computeStats(sanitized);
				const current = computeStats(currentGames);

				let preview = '<div style="font-size: 14px;">';
				preview += `<p><strong>Save file:</strong> ${loaded.gamesPlayed} game${loaded.gamesPlayed !== 1 ? "s" : ""}`;
				if (loaded.highestScore.score > 0) {
					preview += `, best: ${loaded.highestScore.name} ${loaded.highestScore.score}`;
				}
				preview += "</p>";

				preview += `<p><strong>Current:</strong> `;
				if (currentGames.length > 0) {
					preview += `${current.gamesPlayed} game${current.gamesPlayed !== 1 ? "s" : ""}`;
					if (current.highestScore.score > 0) {
						preview += `, best: ${current.highestScore.name} ${current.highestScore.score}`;
					}
				} else {
					preview += `<span style="color: var(--muted);">no records</span>`;
				}
				preview += "</p></div>";

				document.getElementById("statsLoadPreview").innerHTML = preview;
				document.getElementById("statsLoadModal").classList.add("show");
			}

			function handlePastGamesLoad(action) {
				document.getElementById("statsLoadModal").classList.remove("show");
				if (!pendingLoadedGames) return;

				if (action === "replace") {
					savePastGames(pendingLoadedGames);
				} else if (action === "merge") {
					savePastGames(mergePastGames(getPastGames() || [], pendingLoadedGames));
				}
				// "skip": do nothing

				pendingLoadedGames = null;
			}

			function mergePastGames(current, loaded) {
				const seen = new Set(
					current.map((g) => g.startedAt + "|" + g.players.map((p) => p.name).sort().join(","))
				);
				const unique = loaded.filter(
					(g) => !seen.has(g.startedAt + "|" + g.players.map((p) => p.name).sort().join(","))
				);
				return [...current, ...unique].sort((a, b) => a.startedAt.localeCompare(b.startedAt));
			}

			function toggleMenu() {
				const controls = document.querySelector(".controls");
				controls.classList.toggle("open");
				const btn = document.getElementById("menuToggle");
				btn.textContent = controls.classList.contains("open") ? "✕" : "☰";
			}

			document.addEventListener("keydown", (e) => {
				if (e.key !== " " && e.key !== "Enter") return;
				if (document.querySelector(".modal.show")) return;
				const btn = document.getElementById("rollBtn");
				if (btn && !btn.disabled) {
					e.preventDefault();
					rollDice();
				}
			});
		</script>
